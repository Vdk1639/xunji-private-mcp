[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xunji-private-mcp"
version = "0.3.3"
description = "A private MCP server for the Xunji Open API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.30,<2",
    "pydantic>=2.11,<3",
    "starlette>=1.10,<2",
]

[project.scripts]
xunji-private-mcp = "xunji_private_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/xunji_private_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
