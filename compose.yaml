services:
  xunji-private-mcp:
    build: .
    image: xunji-private-mcp:local
    environment:
      XUNJI_HTTP_ALLOWED_HOSTS: ${XUNJI_HTTP_ALLOWED_HOSTS:-}
      XUNJI_HTTP_ALLOWED_ORIGINS: ${XUNJI_HTTP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
